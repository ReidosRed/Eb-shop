<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studios Red</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#120607;--panel:#1c0b0d;--line:#3a1519;--red:#e11d2e;--ember:#ff5a3c;--bone:#f5ece8;--mute:#a08c8a;--ok:#3ecf8e;--warn:#f5b942;
--f-d:'Anton',Impact,sans-serif;--f-b:'Sora',system-ui,sans-serif}
@media (prefers-color-scheme:light){:root{}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--bone);font-family:var(--f-b);min-height:100vh;
background-image:radial-gradient(900px 400px at 85% -10%,#4a0d14 0,transparent 70%)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
header{display:flex;align-items:center;gap:1.5rem;padding:1rem 1.5rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:#120607ee;backdrop-filter:blur(8px);z-index:10;flex-wrap:wrap}
.logo{font-family:var(--f-d);font-size:1.7rem;letter-spacing:.04em;text-decoration:none}
.logo b{color:var(--red);font-weight:400}
nav{display:flex;gap:.25rem;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;padding:.55rem .9rem;border-radius:8px;cursor:pointer;color:var(--mute)}
nav button:hover{color:var(--bone)}
nav button.on{color:var(--bone);background:var(--panel);box-shadow:inset 0 -2px var(--red)}
.btn{background:var(--red);border:0;padding:.6rem 1.1rem;border-radius:8px;cursor:pointer;font-weight:600;transition:background .15s}
.btn:hover{background:var(--ember)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--red)}
.btn.ok{background:var(--ok);color:#06210f}
.btn.sm{padding:.35rem .7rem;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:wait}
.discord{background:#5865F2}.discord:hover{background:#4752c4}
.user{display:flex;align-items:center;gap:.6rem;font-size:.9rem}
.user img{width:30px;height:30px;border-radius:50%}
main{max-width:1100px;margin:0 auto;padding:2rem 1.5rem 4rem}
.hero{padding:2.5rem 0 2rem}
.hero h1{font-family:var(--f-d);font-weight:400;font-size:clamp(3rem,10vw,6.5rem);line-height:.95;letter-spacing:.01em;text-transform:uppercase}
.hero h1 span{color:var(--red)}
.hero p{color:var(--mute);margin-top:1rem;max-width:46ch;line-height:1.6}
.bar{display:flex;gap:1rem;justify-content:space-between;align-items:center;margin:1.5rem 0;flex-wrap:wrap}
h2{font-family:var(--f-d);font-weight:400;font-size:1.8rem;letter-spacing:.03em}
input,select,textarea{background:#0d0405;border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--red);outline:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.2rem;display:flex;flex-direction:column;gap:.6rem}
.card.prod{border-top:3px solid var(--red)}
.card.prod:hover{border-color:var(--red)}
.card h3{font-size:1.05rem}
.card p{color:var(--mute);font-size:.9rem;line-height:1.5;flex:1}
.price{font-family:var(--f-d);font-size:1.6rem;color:var(--ember)}
.row{display:flex;justify-content:space-between;align-items:center;gap:.8rem}
.list{display:grid;gap:.6rem}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;cursor:pointer}
.item:hover{border-color:var(--red)}
.item small{color:var(--mute)}
.badge{font-size:.72rem;font-weight:600;padding:.2rem .55rem;border-radius:99px;white-space:nowrap}
.pending,.open{background:#3a2a08;color:var(--warn)}
.approved{background:#0b3322;color:var(--ok)}
.rejected,.closed{background:#3a1015;color:#ff8a93}
.empty{text-align:center;color:var(--mute);padding:2.5rem 1rem;border:1px dashed var(--line);border-radius:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;align-items:start}
.stack{display:grid;gap:.7rem}
label{font-size:.82rem;color:var(--mute);display:grid;gap:.3rem}
dialog{background:var(--panel);color:var(--bone);border:1px solid var(--line);border-radius:14px;padding:1.5rem;width:min(460px,92vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:#000a;backdrop-filter:blur(3px)}
.pix{background:#0d0405;border:1px solid var(--line);border-radius:8px;padding:.8rem;font-size:.88rem;line-height:1.6}
.pix code{color:var(--ember);user-select:all}
.rec{max-width:100%;max-height:200px;border-radius:8px;margin-top:.5rem}
#toasts{position:fixed;right:1rem;bottom:1rem;display:grid;gap:.5rem;z-index:99}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ok);padding:.8rem 1rem;border-radius:8px;max-width:320px;animation:in .2s}
.toast.err{border-left-color:var(--red)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.hide{display:none!important}
.resp{background:#0d0405;border-radius:8px;padding:.6rem .8rem;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="logo" href="#loja">STUDIOS <b>RED</b></a>
  <nav id="nav">
    <button data-v="loja" class="on">Loja</button>
    <button data-v="pedidos">Meus pedidos</button>
    <button data-v="tickets">Suporte</button>
    <button data-v="admin" id="navAdmin" class="hide">Admin</button>
  </nav>
  <div id="auth"></div>
</header>

<main>
  <!-- LOJA -->
  <section id="v-loja">
    <div class="hero">
      <h1>Studios<br><span>Red</span></h1>
      <p>Escolha seu produto, pague por PIX e envie o comprovante. A aprovação é feita pela nossa equipe.</p>
    </div>
    <div class="bar"><h2>Produtos</h2><input id="search" type="search" placeholder="Buscar produto" style="max-width:260px" aria-label="Buscar produto"></div>
    <div class="grid" id="products"></div>
  </section>

  <!-- PEDIDOS -->
  <section id="v-pedidos" class="hide">
    <div class="bar"><h2>Meus pedidos</h2></div>
    <div class="list" id="myOrders"></div>
  </section>

  <!-- TICKETS -->
  <section id="v-tickets" class="hide">
    <div class="bar"><h2>Suporte</h2><button class="btn" id="newTicket">Abrir ticket</button></div>
    <div class="list" id="myTickets"></div>
  </section>

  <!-- ADMIN -->
  <section id="v-admin" class="hide">
    <div class="bar"><h2>Painel admin</h2></div>
    <div class="cols">
      <div class="card"><h3>Novo produto</h3>
        <div class="stack">
          <label>Nome<input id="pName" maxlength="60"></label>
          <label>Preço (R$)<input id="pPrice" type="number" min="0" step="0.01"></label>
          <label>Descrição<textarea id="pDesc" rows="3" maxlength="300"></textarea></label>
          <button class="btn" id="addProd">Adicionar produto</button>
        </div>
        <h3 style="margin-top:1rem">Produtos</h3><div class="stack" id="adminProds"></div>
      </div>
      <div class="card"><h3>Pedidos</h3><div class="stack" id="adminOrders"></div></div>
      <div class="card"><h3>Tickets</h3><div class="stack" id="adminTickets"></div>
        <h3 style="margin-top:1rem">Cupons</h3>
        <div class="stack" id="adminCoupons"></div>
        <div class="row"><input id="cCode" placeholder="CÓDIGO" maxlength="20"><input id="cPct" type="number" min="1" max="100" placeholder="%" style="width:80px"><button class="btn sm" id="addCoupon">Criar</button></div>
      </div>
    </div>
  </section>
</main>

<!-- Compra -->
<dialog id="dBuy"><div class="stack">
  <div class="row"><h2>Finalizar compra</h2><button class="btn ghost sm" data-close>Fechar</button></div>
  <div class="pix"><b id="buyName"></b><br>Valor: <b id="buyPrice"></b></div>
  <label>Cupom (opcional)<input id="buyCoupon" maxlength="20" placeholder="Código"></label>
  <div class="pix">Pague por PIX:<br>Chave: <code id="pixKey"></code><br>Nome: <span id="pixName"></span></div>
  <label>Comprovante (imagem até 5 MB)<input id="buyReceipt" type="file" accept="image/png,image/jpeg,image/webp"></label>
  <img id="buyPreview" class="rec hide" alt="Pré-visualização do comprovante">
  <button class="btn" id="buyConfirm">Enviar pedido</button>
</div></dialog>

<!-- Detalhe pedido -->
<dialog id="dOrder"><div class="stack" id="orderBody"></div></dialog>

<!-- Novo ticket -->
<dialog id="dNewTicket"><div class="stack">
  <div class="row"><h2>Novo ticket</h2><button class="btn ghost sm" data-close>Fechar</button></div>
  <label>Assunto<input id="tSubject" maxlength="80"></label>
  <label>Motivo<select id="tReason"><option>Problema com a compra</option><option>Pedido de reembolso</option><option>Dúvida sobre produtos</option><option>Outro</option></select></label>
  <label>Mensagem<textarea id="tMsg" rows="4" maxlength="800"></textarea></label>
  <button class="btn" id="tSend">Enviar ticket</button>
</div></dialog>

<!-- Detalhe ticket -->
<dialog id="dTicket"><div class="stack" id="ticketBody"></div></dialog>

<div id="toasts" aria-live="polite"></div>

<script>
/* ============ CONFIGURAÇÃO ============ */
const CONFIG = {
  // Discord Developer Portal > OAuth2: copie o Client ID e cadastre a URL EXATA deste site em Redirects.
  DISCORD_CLIENT_ID: "COLE_SEU_CLIENT_ID_AQUI",
  // IDs do Discord (número) de quem pode administrar. Ative o Modo Desenvolvedor no Discord > botão direito no perfil > Copiar ID.
  ADMIN_IDS: ["COLE_SEU_ID_AQUI"],
  PIX_KEY: "003.613.723.53",
  PIX_NAME: "Miguel Mendes Matos"
};

/* ============ UTILIDADES ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "R$ " + Number(n).toFixed(2).replace(".", ",");
const fdate = d => new Date(d).toLocaleString("pt-BR", {dateStyle:"short", timeStyle:"short"});
const uid = () => crypto.randomUUID();
const STATUS = {pending:"Pendente", approved:"Aprovado", rejected:"Rejeitado", open:"Aberto", closed:"Fechado"};
const badge = s => `<span class="badge ${s}">${STATUS[s]}</span>`;

function toast(msg, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.textContent = msg;
  $("#toasts").append(t);
  setTimeout(() => t.remove(), 3800);
}

/* ============ DADOS (localStorage) ============
   ATENÇÃO: localStorage fica só no navegador de cada pessoa. Para a loja de verdade,
   troque estas funções por chamadas a um servidor (veja as instruções na resposta). */
const DEFAULTS = {
  products: [
    {id:"p1", name:"Item Red 1", price:10, description:"Descrição do item 1"},
    {id:"p2", name:"Item Red 2", price:15.5, description:"Descrição do item 2"},
    {id:"p3", name:"Item Red 3", price:20, description:"Descrição do item 3"}
  ],
  coupons: [{code:"RED10", pct:10}, {code:"RED20", pct:20}],
  orders: [], tickets: []
};
const db = {};
function load() {
  for (const k in DEFAULTS) {
    try { db[k] = JSON.parse(localStorage.getItem("sr_" + k)) ?? structuredClone(DEFAULTS[k]); }
    catch { db[k] = structuredClone(DEFAULTS[k]); }
  }
}
function save() {
  try { for (const k in DEFAULTS) localStorage.setItem("sr_" + k, JSON.stringify(db[k])); }
  catch { toast("Sem espaço para salvar. Use comprovantes menores.", true); }
}
load();

/* ============ LOGIN COM DISCORD (OAuth2 implicit) ============ */
let user = null;
try { user = JSON.parse(sessionStorage.getItem("sr_user")); } catch {}
const isAdmin = () => !!user && CONFIG.ADMIN_IDS.includes(user.id);

function loginUrl() {
  const state = uid();
  sessionStorage.setItem("sr_state", state);
  const p = new URLSearchParams({
    client_id: CONFIG.DISCORD_CLIENT_ID, response_type: "token", scope: "identify",
    redirect_uri: location.origin + location.pathname, state
  });
  return "https://discord.com/oauth2/authorize?" + p;
}

async function handleOAuthReturn() {
  if (!location.hash.includes("access_token")) return;
  const p = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, "", location.pathname);
  if (p.get("state") !== sessionStorage.getItem("sr_state")) return toast("Login inválido. Tente de novo.", true);
  try {
    const r = await fetch("https://discord.com/api/users/@me", {headers: {Authorization: "Bearer " + p.get("access_token")}});
    if (!r.ok) throw 0;
    const u = await r.json();
    user = {id: u.id, name: u.global_name || u.username,
      avatar: u.avatar ? `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=64` : ""};
    sessionStorage.setItem("sr_user", JSON.stringify(user));
    toast("Bem-vindo, " + user.name + "!");
  } catch { toast("Não foi possível entrar com o Discord.", true); }
}

function renderAuth() {
  const a = $("#auth");
  if (user) {
    a.innerHTML = `<div class="user">${user.avatar ? `<img src="${esc(user.avatar)}" alt="">` : ""}<span>${esc(user.name)}</span><button class="btn ghost sm" id="logout">Sair</button></div>`;
    $("#logout").onclick = () => { sessionStorage.removeItem("sr_user"); user = null; refresh(); show("loja"); };
  } else {
    a.innerHTML = `<a class="btn discord" style="text-decoration:none;display:inline-block" href="${esc(loginUrl())}">Entrar com Discord</a>`;
  }
  $("#navAdmin").classList.toggle("hide", !isAdmin());
}

/* ============ NAVEGAÇÃO ============ */
function show(v) {
  if ((v === "pedidos" || v === "tickets") && !user) { toast("Entre com o Discord primeiro.", true); v = "loja"; }
  if (v === "admin" && !isAdmin()) v = "loja";
  document.querySelectorAll("main > section").forEach(s => s.classList.toggle("hide", s.id !== "v-" + v));
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  refresh();
}
$("#nav").onclick = e => { if (e.target.dataset.v) show(e.target.dataset.v); };
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest("dialog").close());

/* ============ LOJA ============ */
function renderProducts() {
  const q = $("#search").value.toLowerCase();
  const list = db.products.filter(p => (p.name + p.description).toLowerCase().includes(q));
  $("#products").innerHTML = list.length ? list.map(p => `
    <article class="card prod"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p>
    <div class="row"><span class="price">${money(p.price)}</span><button class="btn" data-buy="${esc(p.id)}">Comprar</button></div></article>`).join("")
    : `<div class="empty" style="grid-column:1/-1">Nenhum produto encontrado.</div>`;
}
$("#search").oninput = renderProducts;
$("#products").onclick = e => {
  const id = e.target.dataset.buy; if (!id) return;
  if (!user) return toast("Entre com o Discord para comprar.", true);
  const p = db.products.find(x => x.id === id); if (!p) return;
  cur.product = p;
  $("#buyName").textContent = p.name; $("#buyPrice").textContent = money(p.price);
  $("#pixKey").textContent = CONFIG.PIX_KEY; $("#pixName").textContent = CONFIG.PIX_NAME;
  $("#buyCoupon").value = ""; $("#buyReceipt").value = ""; $("#buyPreview").classList.add("hide");
  $("#dBuy").showModal();
};
const cur = {};

/* comprime a imagem para caber no armazenamento */
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 900 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * k; c.height = img.height * k;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .7));
    };
    img.onerror = () => rej(); img.src = url;
  });
}
$("#buyReceipt").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > 5e6) { e.target.value = ""; return toast("Imagem maior que 5 MB.", true); }
  try { const s = await shrink(f); $("#buyPreview").src = s; $("#buyPreview").classList.remove("hide"); }
  catch { e.target.value = ""; toast("Arquivo de imagem inválido.", true); }
};
$("#buyConfirm").onclick = async () => {
  const f = $("#buyReceipt").files[0];
  if (!f) return toast("Envie o comprovante do PIX.", true);
  const btn = $("#buyConfirm"); btn.disabled = true;
  try {
    const receipt = await shrink(f);
    const code = $("#buyCoupon").value.trim().toUpperCase();
    const cp = db.coupons.find(c => c.code === code);
    if (code && !cp) { btn.disabled = false; return toast("Cupom inválido.", true); }
    const final = cur.product.price * (1 - (cp ? cp.pct : 0) / 100);
    db.orders.push({id: uid(), productName: cur.product.name, original: cur.product.price, final,
      coupon: cp ? cp.code : null, userId: user.id, discord: user.name, receipt, date: new Date().toISOString(), status: "pending"});
    save(); $("#dBuy").close();
    toast("Pedido enviado! A entrega pode levar até 72 horas."); refresh();
  } catch { toast("Não foi possível processar o comprovante.", true); }
  btn.disabled = false;
};

/* ============ PEDIDOS ============ */
function orderRow(o, admin) {
  return `<div class="item" data-order="${esc(o.id)}"><div class="row"><div><b>${esc(o.productName)}</b><br><small>${admin ? esc(o.discord) + " · " : ""}${fdate(o.date)}</small></div>
  <div style="text-align:right"><b>${money(o.final)}</b><br>${badge(o.status)}</div></div></div>`;
}
function renderMyOrders() {
  const l = user ? db.orders.filter(o => o.userId === user.id).reverse() : [];
  $("#myOrders").innerHTML = l.length ? l.map(o => orderRow(o)).join("") : `<div class="empty">Você ainda não fez pedidos.</div>`;
}
function openOrder(id) {
  const o = db.orders.find(x => x.id === id); if (!o) return;
  if (!isAdmin() && o.userId !== user?.id) return;
  $("#orderBody").innerHTML = `<div class="row"><h2>Pedido</h2><button class="btn ghost sm" data-close>Fechar</button></div>
  <div class="pix"><b>${esc(o.productName)}</b><br>Preço: ${money(o.original)}${o.coupon ? ` (cupom ${esc(o.coupon)})` : ""}<br>Total: <b>${money(o.final)}</b><br>Cliente: ${esc(o.discord)}<br>Status: ${badge(o.status)}</div>
  <img class="rec" src="${esc(o.receipt)}" alt="Comprovante">
  ${isAdmin() && o.status === "pending" ? `<div class="row"><button class="btn ok" data-set="approved">Aprovar</button><button class="btn" data-set="rejected">Rejeitar</button></div>` : ""}`;
  $("#orderBody").querySelector("[data-close]").onclick = () => $("#dOrder").close();
  $("#orderBody").querySelectorAll("[data-set]").forEach(b => b.onclick = () => {
    if (!isAdmin()) return;
    o.status = b.dataset.set; save(); $("#dOrder").close(); refresh(); toast("Pedido " + STATUS[o.status].toLowerCase() + ".");
  });
  $("#dOrder").showModal();
}
document.addEventListener("click", e => { const r = e.target.closest("[data-order]"); if (r) openOrder(r.dataset.order); });

/* ============ TICKETS ============ */
function ticketRow(t, admin) {
  return `<div class="item" data-ticket="${esc(t.id)}"><div class="row"><div><b>${esc(t.subject)}</b><br><small>${admin ? esc(t.discord) + " · " : ""}${fdate(t.date)}</small></div>${badge(t.status)}</div></div>`;
}
function renderMyTickets() {
  const l = user ? db.tickets.filter(t => t.userId === user.id).reverse() : [];
  $("#myTickets").innerHTML = l.length ? l.map(t => ticketRow(t)).join("") : `<div class="empty">Nenhum ticket aberto. Precisa de ajuda? Clique em "Abrir ticket".</div>`;
}
$("#newTicket").onclick = () => { $("#tSubject").value = ""; $("#tMsg").value = ""; $("#dNewTicket").showModal(); };
$("#tSend").onclick = () => {
  const subject = $("#tSubject").value.trim(), message = $("#tMsg").value.trim();
  if (!subject || !message) return toast("Preencha assunto e mensagem.", true);
  db.tickets.push({id: uid(), subject, reason: $("#tReason").value, message, userId: user.id, discord: user.name,
    date: new Date().toISOString(), status: "open", responses: []});
  save(); $("#dNewTicket").close(); refresh(); toast("Ticket enviado!");
};
function openTicket(id) {
  const t = db.tickets.find(x => x.id === id); if (!t) return;
  if (!isAdmin() && t.userId !== user?.id) return;
  $("#ticketBody").innerHTML = `<div class="row"><h2>${esc(t.subject)}</h2><button class="btn ghost sm" data-x>Fechar</button></div>
  <small>${esc(t.reason)} · ${fdate(t.date)} · ${badge(t.status)}</small>
  <div class="resp">${esc(t.message)}</div>
  ${t.responses.map(r => `<div class="resp" style="border-left:3px solid var(--red)"><small>${esc(r.author)} · ${fdate(r.date)}</small><br>${esc(r.message)}</div>`).join("")}
  ${t.status === "open" ? `<textarea id="rMsg" rows="3" maxlength="800" placeholder="Escreva uma resposta"></textarea><div class="row"><button class="btn" id="rSend">Responder</button>${isAdmin() ? `<button class="btn ghost" id="rClose">Fechar ticket</button>` : ""}</div>` : ""}`;
  $("#ticketBody [data-x]").onclick = () => $("#dTicket").close();
  const s = $("#rSend");
  if (s) s.onclick = () => {
    const m = $("#rMsg").value.trim(); if (!m) return toast("Escreva uma resposta.", true);
    t.responses.push({author: isAdmin() ? "Equipe Studios Red" : user.name, message: m, date: new Date().toISOString()});
    save(); openTicket(id); refresh();
  };
  const c = $("#rClose");
  if (c) c.onclick = () => { if (!isAdmin()) return; t.status = "closed"; save(); $("#dTicket").close(); refresh(); toast("Ticket fechado."); };
  $("#dTicket").showModal();
}
document.addEventListener("click", e => { const r = e.target.closest("[data-ticket]"); if (r) openTicket(r.dataset.ticket); });

/* ============ ADMIN ============ */
function renderAdmin() {
  if (!isAdmin()) return;
  $("#adminProds").innerHTML = db.products.map(p => `<div class="row item" style="cursor:default"><span>${esc(p.name)} <small>${money(p.price)}</small></span><button class="btn ghost sm" data-delp="${esc(p.id)}">Remover</button></div>`).join("") || `<div class="empty">Sem produtos.</div>`;
  $("#adminOrders").innerHTML = db.orders.slice().reverse().map(o => orderRow(o, true)).join("") || `<div class="empty">Sem pedidos.</div>`;
  $("#adminTickets").innerHTML = db.tickets.slice().reverse().map(t => ticketRow(t, true)).join("") || `<div class="empty">Sem tickets.</div>`;
  $("#adminCoupons").innerHTML = db.coupons.map(c => `<div class="row item" style="cursor:default"><span>${esc(c.code)} <small>${c.pct}%</small></span><button class="btn ghost sm" data-delc="${esc(c.code)}">Remover</button></div>`).join("");
}
$("#addProd").onclick = () => {
  if (!isAdmin()) return;
  const name = $("#pName").value.trim(), price = parseFloat($("#pPrice").value), description = $("#pDesc").value.trim();
  if (!name || !(price >= 0) || !description) return toast("Preencha nome, preço e descrição.", true);
  db.products.push({id: uid(), name, price, description}); save();
  ["#pName", "#pPrice", "#pDesc"].forEach(s => $(s).value = ""); refresh(); toast("Produto adicionado.");
};
$("#addCoupon").onclick = () => {
  if (!isAdmin()) return;
  const code = $("#cCode").value.trim().toUpperCase(), pct = parseInt($("#cPct").value);
  if (!code || !(pct >= 1 && pct <= 100)) return toast("Informe código e porcentagem (1 a 100).", true);
  if (db.coupons.some(c => c.code === code)) return toast("Esse cupom já existe.", true);
  db.coupons.push({code, pct}); save(); $("#cCode").value = ""; $("#cPct").value = ""; refresh();
};
document.addEventListener("click", e => {
  if (!isAdmin()) return;
  if (e.target.dataset.delp) { db.products = db.products.filter(p => p.id !== e.target.dataset.delp); save(); refresh(); toast("Produto removido."); }
  if (e.target.dataset.delc) { db.coupons = db.coupons.filter(c => c.code !== e.target.dataset.delc); save(); refresh(); }
});

/* ============ INÍCIO ============ */
function refresh() { renderAuth(); renderProducts(); renderMyOrders(); renderMyTickets(); renderAdmin(); }
(async () => { await handleOAuthReturn(); show("loja"); })();
</script>
</body>
</html>
